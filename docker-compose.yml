# Local stack.
#   docker compose up -d                 -> PostgreSQL + PostGIS and Redis only (run the API from your IDE)
#   docker compose --profile app up -d   -> also builds and runs the API on :8080
# Values come from .env (copy .env.example).
name: geops

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: geops
      POSTGRES_USER: ${DB_USERNAME:-geops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d geops"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/geops
      REDIS_HOST: redis
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db-data:
